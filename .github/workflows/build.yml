name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.5.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          unzip -q gradle-9.5.1-bin.zip
          echo "$PWD/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir project
          unzip -q tnt-cart-optimizer-fixed.zip -d project

      - name: Find project
        run: |
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build
        run: |
          cd "$(dirname "$(find project -name build.gradle -o -name build.gradle.kts | head -1)")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tnt-cart-optimizer
          path: project/**/build/libs/*.jar
